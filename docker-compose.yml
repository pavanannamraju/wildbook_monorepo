services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wildbook-web:latest
    container_name: wildbook-web
    restart: unless-stopped
    # Bind to loopback only — public traffic should go through Nginx (80/443 → HTTPS).
    # Do not publish 0.0.0.0:8000; that exposes plain HTTP on the VPS IP.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Container must listen on all interfaces (override local HOST=127.0.0.1).
      HOST: "0.0.0.0"
      PORT: "8000"
      # Mounted Firebase admin JSON (do not bake secrets into the image).
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      # list[str] must be valid JSON — empty string from .env.example will crash Settings.
      AUTH_ADMIN_GOOGLE_EMAILS: ${AUTH_ADMIN_GOOGLE_EMAILS:-[]}
    volumes:
      - ./secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/public-config', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
