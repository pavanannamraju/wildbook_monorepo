name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - pavan
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - pavan

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Build-time values used to generate `build/public-config` for static hosting.
    env:
      BUN_PUBLIC_CONFIG_JSON: ${{ secrets.BUN_PUBLIC_CONFIG_JSON }}
      BUN_PUBLIC_BACKEND_ORIGIN: ${{ secrets.BUN_PUBLIC_BACKEND_ORIGIN }}
      BUN_PUBLIC_FIREBASE_API_KEY: ${{ secrets.BUN_PUBLIC_FIREBASE_API_KEY }}
      BUN_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.BUN_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      BUN_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.BUN_PUBLIC_FIREBASE_PROJECT_ID }}
      BUN_PUBLIC_FIREBASE_APP_ID: ${{ secrets.BUN_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_OCEAN_02042D500 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # App artifact location; must match build.ts outdir (portal is read-only when using this workflow)
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_OCEAN_02042D500 }}
          action: "close"
